name: Product Intent API and UI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  api-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify API and React UI scenarios
        run: node product-intent/verify-app.mjs --source-root .
