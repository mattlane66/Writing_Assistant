name: Product Intent Browser Journeys
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  chromium-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned browser automation (CI only)
        run: |
          mkdir -p /tmp/intent-browser-tools
          printf '{}' > /tmp/intent-browser-tools/package.json
          npm --prefix /tmp/intent-browser-tools install --no-save --ignore-scripts playwright@1.56.1
      - name: Run real browser journeys
        env:
          PLAYWRIGHT_ROOT: /tmp/intent-browser-tools
        run: node product-intent/browser-journeys.mjs --source-root .
      - name: Benchmark seeded regressions and harmless changes
        env:
          PLAYWRIGHT_ROOT: /tmp/intent-browser-tools
        run: node product-intent/browser-mutations.mjs
