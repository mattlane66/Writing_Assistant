name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check

  package-writing-assistant-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build portable skills + MCP package
        env:
          WRITING_ASSISTANT_MCP_URL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'https://writing-assistant-mcp.up.railway.app/mcp' || 'https://example.com/mcp' }}
        run: |
          if [ "$WRITING_ASSISTANT_MCP_URL" = "https://example.com/mcp" ]; then
            python3 scripts/package-writing-assistant-plugin.py --allow-example-url
          else
            python3 scripts/package-writing-assistant-plugin.py
          fi
      - name: Inspect package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archives = list(Path('products/writing-assistant-plugin/dist').glob('*.zip'))
          assert len(archives) == 1
          with ZipFile(archives[0]) as archive:
              assert archive.testzip() is None
              names = set(archive.namelist())
              assert 'plugin.json' in names
              assert 'mcp.json' in names
              assert 'skills/writing-assistant/SKILL.md' in names
              assert 'skills/writing-assistant/references/WRITING_EDITORIAL_REFERENCE.md' in names
              mcp = archive.read('mcp.json').decode('utf-8')
              if __import__('os').environ.get('GITHUB_EVENT_NAME') == 'push':
                  assert 'https://writing-assistant-mcp.up.railway.app/mcp' in mcp
          PY
      - name: Upload production plugin ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: writing-assistant-0.42.1-mcp
          path: products/writing-assistant-plugin/dist/Writing-Assistant-0.42.1-MCP.zip
          if-no-files-found: error

  package-writing-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run diagnostic:package
      - name: Check the standalone ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archives = list(Path('products/writing-diagnostic/dist').glob('*.zip'))
          assert len(archives) == 1
          with ZipFile(archives[0]) as archive:
              assert archive.testzip() is None
              archive.extractall('/tmp/writing-diagnostic-export')
          PY
          npm --prefix /tmp/writing-diagnostic-export/writing-diagnostic test
          npm --prefix /tmp/writing-diagnostic-export/writing-diagnostic run check
