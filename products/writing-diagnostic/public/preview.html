<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sample review · Writing Diagnostic</title><link rel="icon" href="/assets/icon.svg"><style>*{box-sizing:border-box}body{margin:0;background:#f6f6f4;color:#181817;font:15px/1.5 system-ui,sans-serif}header,main{max-width:1260px;margin:auto;padding:20px}h1{font-size:25px;margin:8px 0}p{color:#6a6964}a{color:#5350c9}iframe{display:block;width:100%;height:900px;border:0;background:transparent}#status{padding:10px;border-radius:8px;background:#fff8e8}</style></head><body><header><a href="/">Writing Diagnostic</a><h1>Sample review</h1><p>These findings are prepared examples. Live analysis happens in ChatGPT or Codex.</p><p>Choose a primitive or marked phrase to open its judgment and repair bank.</p><div id="status" role="status">Preparing the sample…</div></header><main><iframe id="widget" src="/diagnostic-widget.html" title="Interactive writing diagnostic"></iframe></main><script>
(()=>{
  const frame=document.querySelector('#widget'),status=document.querySelector('#status');let data=null,ready=false;
  function notify(){if(ready&&data)frame.contentWindow.postMessage({jsonrpc:'2.0',method:'ui/notifications/tool-result',params:{structuredContent:data}},location.origin)}
  window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||event.origin!==location.origin)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;
    if(m.method==='ui/initialize'){frame.contentWindow.postMessage({jsonrpc:'2.0',id:m.id,result:{protocolVersion:'2026-01-26',hostInfo:{name:'Writing Diagnostic sample preview',version:'1.2.0'},hostCapabilities:{},hostContext:{theme:'light',displayMode:'fullscreen'}}},location.origin)}
    if(m.method==='ui/notifications/initialized'){ready=true;notify()}
    if(m.method==='ui/notifications/size-changed'&&Number.isFinite(m.params?.height))frame.style.height=Math.max(400,Math.min(10000,m.params.height+16))+'px';
  });
  (async()=>{try{const fixture=await (await fetch('/sample-diagnostic.json')).json();const response=await fetch('/mcp',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json, text/event-stream'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'tools/call',params:{name:'render_writing_diagnostic',arguments:fixture}})});const result=await response.json();if(result.error||result.result?.isError||!result.result?.structuredContent)throw Error('Could not prepare the sample.');data=result.result.structuredContent;status.textContent='Sample ready. Select a phrase or primitive.';status.dataset.state='ready';notify()}catch(_){status.textContent='The sample could not load. Check that the server is running.';status.dataset.state='error'}})();
})();
</script></body></html>
